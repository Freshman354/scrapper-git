{% extends "base.html" %}
{% block title %}{{ page_title }} · Scraper{% endblock %}

{% block content %}
<div class="mx-auto max-w-2xl">
  <h1 class="text-2xl font-semibold tracking-tight text-slate-900">{{ page_title }}</h1>
  <div class="mt-6 rounded-lg border border-dashed border-slate-300 bg-white p-8 text-center">
    <p class="text-sm text-slate-500">Not built yet — this page arrives in step {{ step }} of the rebuild plan.</p>
    <a href="{{ url_for('new_scrape') }}"
       class="mt-4 inline-flex min-h-[44px] items-center rounded-md bg-blue-600 px-5 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-blue-700">
      Start a scrape
    </a>
  </div>
</div>
{% endblock %}
